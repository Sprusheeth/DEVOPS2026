version: '3.8'

services:
  # ─── Backend API ──────────────────────────────────────────
  backend:
    build: ./backend
    container_name: finance-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
    volumes:
      - ./backend:/app          # Mount source for hot reloading
      - /app/node_modules       # Prevent overwriting container's node_modules
    restart: unless-stopped

  # ─── Frontend React App ───────────────────────────────────
  frontend:
    build: ./frontend
    container_name: finance-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000   # API URL env variable
    volumes:
      - ./frontend:/app         # Mount source for hot reloading
      - /app/node_modules       # Prevent overwriting container's node_modules
    depends_on:
      - backend
    restart: unless-stopped
